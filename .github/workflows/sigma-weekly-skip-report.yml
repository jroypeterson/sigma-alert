name: Sigma Weekly Skip Report

# Posts a weekly summary of skipped tickers to the #status-reports Slack
# channel. Runs Friday evening, after the Friday EOD close workflow has
# landed its commit to cache/skip_log.json.
#
# Close fires at 21:30 UTC (4:30 PM EST / 5:30 PM EDT). This report runs
# one hour later at 22:30 UTC to give the close job time to finish its
# download, screen, commit, and push steps before we read the file.

on:
  schedule:
    - cron: '30 22 * * 5'
  workflow_dispatch:  # manual trigger for testing

jobs:
  weekly-skip-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # The report script only needs `requests` + stdlib, but pinning to the
        # project requirements keeps us aligned with how the rest of CI runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post weekly skip report
        env:
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
        run: python scripts/weekly_skip_report.py

      - name: Failure backstop
        # The report failed 2026-09-12, 09-19 and 09-26 (Slack 400 on a 755-chip
        # section) and nothing said so: the report IS the only post this
        # workflow makes, so its failure was silent. Same backstop pattern as
        # the cycle workflows. Plain text via jq so the message is JSON-safe.
        if: failure()
        env:
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_STATUS_REPORTS_WEBHOOK" ] || exit 0
          msg=":x: *sigma-alert weekly skip report - error*  health/v1
          The Friday skip report did not post. Run: $RUN_URL"
          jq -n --arg t "$msg" '{blocks: [{type: "section", text: {type: "mrkdwn", text: $t}}], text: $t}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_STATUS_REPORTS_WEBHOOK" > /dev/null \
            || echo "[WARN] backstop post failed"
