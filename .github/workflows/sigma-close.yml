name: Sigma Screener — Close

on:
  schedule:
    # 4:30 PM EST / 5:30 PM EDT = 21:30 UTC
    # Uses EST-aligned offset so the run always fires after the 4:00 PM ET
    # market close, regardless of daylight saving time.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # manual trigger for testing

jobs:
  screen-close:
    runs-on: ubuntu-latest
    # Decision: write permission needed to push the updated cache file
    # back to the repo after the EOD run.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sigma screener (close mode)
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
        run: python scripts/sigma_screener.py --mode close

      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/distribution_cache.json
          # missing_metadata.json may or may not exist depending on whether
          # the screener found any gaps; -A picks up additions and deletions.
          git add -A cache/missing_metadata.json
          # skip_log.json is rewritten every close run (trimmed to 30-day window).
          # Consumed by Coverage Manager's weekly report for skip-stats analysis.
          git add -A cache/skip_log.json
          # returns_snapshot.json — the day's index/sector/macro returns block,
          # persisted so scripts/return_map.py can rebuild the interactive
          # periodic-table-of-returns (readable/return_map.html) offline without
          # refetching any market data. Written every full run; may be absent.
          git add -A cache/returns_snapshot.json
          # --allow-empty is NOT used — if nothing changed, no commit is made
          git diff --cached --quiet || git commit -m "Update distribution cache [skip ci]"
          git push

      - name: Health fallback on failure
        if: failure()
        env:
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # HEALTH_REPORTING.md 4.6: the in-process heartbeat is skipped when
          # the screener crashes or exits early - this backstop posts the
          # error heartbeat so a dead run is never silent in #status-reports.
          [ -n "$SLACK_STATUS_REPORTS_WEBHOOK" ] || exit 0
          curl -sS -X POST -H 'Content-Type: application/json' --data "{\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\":x: *sigma-alert - error*  |  health/v1: run crashed before the in-process heartbeat - <${RUN_URL}|Actions log>\"}}],\"text\":\"sigma-alert error (crashed run)\"}" "$SLACK_STATUS_REPORTS_WEBHOOK"
