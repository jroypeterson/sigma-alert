name: Refresh S&P 500

on:
  # 1st of each month, 10:00 AM ET = 14:00 UTC (15:00 during EST)
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:  # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Full history so the rebase in the commit-back step below can work;
          # a shallow clone makes `git pull --rebase` unreliable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests lxml

      - name: Refresh S&P 500 constituents
        run: python scripts/refresh_sp500.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # BOTH files. `refresh_sp500.py` rewrites sources/sp500_names.json on every
          # run by design -- its own comment says "Always refresh the names file -- even
          # if the ticker set is unchanged, company renames should propagate" -- but this
          # step staged only sp500.txt, so that write was discarded every month.
          # Measured 2026-09-16: the names file's last commit was 2026-04-13 against a
          # 2026-09-01 ticker refresh, and it was missing 10 current members (MRVL, RDDT,
          # VEEV, FERG, FLEX, BNY, ECHO, FDXF, HONA, VMRK) while carrying 10 departed
          # ones. sigma_screener.load_sp500_names() fills company names for the ~390 S&P
          # names Coverage Manager holds no metadata for, so each of those rendered in
          # Slack as a bare ticker. Found by Coverage Manager's index-mirror check.
          git add sources/sp500.txt sources/sp500_names.json
          git diff --cached --quiet || git commit -m "Refresh S&P 500 constituents and names (monthly) [skip ci]"
          git push

      - name: Re-sync watchlist
        run: python scripts/sync_watchlist.py

      - name: Commit watchlist if changed
        run: |
          git add watchlist.txt
          if git diff --cached --quiet; then
            echo "watchlist.txt unchanged - nothing to push"
            exit 0
          fi
          git commit -m "Sync watchlist after S&P 500 refresh [skip ci]"
          # Same race guard as sync-watchlist.yml: master can move while this
          # job runs, and a plain push then fails non-fast-forward.
          git pull --rebase origin master || {
            git rebase --abort || true
            echo "::error::rebase onto origin/master failed - resolve manually"
            exit 1
          }
          git push
