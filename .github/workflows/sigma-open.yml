name: Sigma Screener — Open

on:
  schedule:
    # 9:35 AM EST / 10:35 AM EDT = 14:35 UTC
    # Uses EST-aligned offset so the run always fires after the 9:30 AM ET
    # market open, regardless of daylight saving time. During EDT months
    # this runs at 10:35 AM ET — one hour later than ideal but guarantees
    # today's opening bar is available from Yahoo Finance.
    - cron: '35 14 * * 1-5'
  workflow_dispatch:  # manual trigger for testing

jobs:
  screen-open:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sigma screener (open mode)
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
        shell: bash
        run: |
          # pipefail is LOAD-BEARING here: without it the pipeline's exit status
          # is tee's (always 0), the step would PASS on a crash, `if: failure()`
          # would never fire, and the health backstop below would go silent --
          # strictly worse than the bug this log capture exists to diagnose.
          # Never drop it while this pipes.
          set -eo pipefail
          python scripts/sigma_screener.py --mode open 2>&1 | tee /tmp/sigma_run.log

      - name: Health fallback on failure
        if: failure()
        env:
          SLACK_STATUS_REPORTS_WEBHOOK: ${{ secrets.SLACK_STATUS_REPORTS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # HEALTH_REPORTING.md 4.6: the in-process heartbeat is skipped when
          # the screener crashes or exits early - this backstop posts the
          # error heartbeat so a dead run is never silent in #status-reports.
          [ -n "$SLACK_STATUS_REPORTS_WEBHOOK" ] || exit 0
          # NAME THE CAUSE. This used to post only "crashed before the in-process
          # heartbeat" plus a link, so every crash cost a trip to the Actions log
          # to learn anything -- and on 2026-07-31 / 2026-08-03 the cause was a
          # one-line NameError the message could simply have carried.
          # Built in python so a traceback is JSON-escaped properly instead of
          # being hand-quoted into a curl --data string.
          python3 scripts/ci_health_payload.py > /tmp/sigma_health.json
          curl -sS -X POST -H 'Content-Type: application/json' \
               --data @/tmp/sigma_health.json "$SLACK_STATUS_REPORTS_WEBHOOK"
